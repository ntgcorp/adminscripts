; ============================================================================
; Configurazione generale
; ============================================================================
[CONFIG]

; EXIT_ON_ERROR: esce al primo errore fatale (true) o continua (false)
EXIT_ON_ERROR=false

; ENGINE: motore di compressione
; 7Z = 7-Zip (consigliato Windows e Linux con p7zip-full)
; TAR = TAR.GZ (consigliato Linux, richiede tar e gzip)
; ZIP = ZIP (nativo Python, funziona su Windows e Linux)
ENGINE=ZIP

; PATH_DEST: cartella di output dei backup (OBBLIGATORIA)
PATH_DEST=path_test

; SUBDIRS: include le sottocartelle negli archivi (true/false)
SUBDIRS=TRUE

; SECTIONS: sezioni da elaborare (facoltativa, se omessa elabora tutte le sezioni)
SECTIONS=TEST

; ============================================================================
; File TEST
; ============================================================================
[TEST]
AI=G:\Il mio Drive\Progetti\AI
ALIENPC=G:\Il mio Drive\Progetti\AlienPC
INDICE=G:\Il mio Drive\Progetti\indice.txt