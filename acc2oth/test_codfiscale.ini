[CONFIG]
; Sorgente Access (relativo alla cartella di questo .ini; assoluto tollerato)
; NOTA: il file esistente si chiama test_codfiscale.accdb (con la "s");
; "test_codficale.accdb" (senza "s") non esiste.
IN.ACCDB=test_codfiscale.accdb
; Cartella output — verra creata se assente
OUT.PATH=test_codfiscale
; File di log relativo a OUT.PATH, in append
LOG=export.log

; --- Oggetti da esportare (solo moduli standard + classi) ---
EXP.FORMS=False
EXP.MODULES=True
EXP.CLASSES=True
EXP.QUERIES=False
EXP.MACROS=False
EXP.REPORTS=False

; --- Derivati LLM: attivi (OPENROUTER.KEY richiesta nel dictConfig finale) ---
EXP.PROMPT=True
; EXP.PROMPT.LIST=
EXP.PYTHON=True
; EXP.PYTHON.LIST=

; --- LLM OpenRouter (obbligatori solo se EXP.PROMPT=True o EXP.PYTHON=True) ---
; OPENROUTER.KEY facoltativa qui: se assente, passare la chiave come 2o parametro CLI:
;   python -m acc2oth test_codfiscale.ini sk-or-v1-TUA_CHIAVE
; OPENROUTER.KEY=
OPENROUTER.MODEL=qwen/qwen-2.5-coder-32b-instruct
